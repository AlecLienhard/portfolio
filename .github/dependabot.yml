version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    groups:
      astro-react: { patterns: ["astro", "@astrojs/*", "react", "react-dom", "@types/react*"] }
    ignore:
      # TypeScript majors wait until @astrojs/check supports them.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
    ignore:
      # Node: stay on LTS (even majors), bumped by hand with .nvmrc.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
      # nginx: odd minors are mainline; stable (even) is bumped by hand.
      # The 1.30-alpine tag already picks up patch releases on every build.
      - dependency-name: nginxinc/nginx-unprivileged
        update-types: ["version-update:semver-minor"]
