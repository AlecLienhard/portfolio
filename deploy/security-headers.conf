# Included in every location that sets headers (add_header does not inherit
# once a location defines its own).
include /etc/nginx/snippets/csp.conf;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# No includeSubDomains: other *.lnrd.lol names are served by other things.
add_header Strict-Transport-Security "max-age=31536000" always;
