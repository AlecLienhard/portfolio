# Static site server for lnrd.lol. Runs in nginx-unprivileged (port 8080,
# non-root) with a read-only root filesystem; cloudflared reaches it on
# 127.0.0.1 of the host.

# Log the real visitor IP (from Cloudflare) instead of the Docker gateway.
set_real_ip_from 127.0.0.1;
set_real_ip_from 172.16.0.0/12;
real_ip_header CF-Connecting-IP;

server_tokens off;

gzip on;
gzip_comp_level 6;
gzip_min_length 512;
gzip_types text/css application/javascript image/svg+xml application/xml application/json text/plain;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    error_page 404 /404.html;

    # Cache-busting hashed assets: cache forever.
    location /_astro/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/index.html $uri.html =404;
    }
}
